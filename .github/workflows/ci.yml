name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # next build type-checks the app itself; no API key is needed because
      # the agent client falls back to the mock when ANTHROPIC_API_KEY is unset.
      - name: lint
        run: npm run lint
      # Standalone: next typegen writes the LayoutProps/PageProps globals into
      # .next/types, then tsc checks the whole project without a build.
      - name: typecheck
        run: npm run typecheck
      - name: production build
        run: npm run build

  instructions:
    # AGENTS.md says how to run the tests and where things are. mandata checks that it is still true.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install git+https://github.com/patkusch/mandata
      - run: mandata .
