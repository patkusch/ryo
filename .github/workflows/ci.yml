name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      # next build type-checks the app itself; no API key is needed because
      # the agent client falls back to the mock when ANTHROPIC_API_KEY is unset.
      - name: lint
        run: npm run lint
      - name: production build
        run: npm run build
      # After the build, because Next generates the LayoutProps/PageProps globals
      # into .next/types; a standalone tsc before that fails on them.
      - name: typecheck
        run: npx tsc --noEmit
